[project]
name = "langchain-use-pydantic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "farhheenkhan254-fk", email = "farhheenkhan254@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.16.0",
    "langchain>=1.3.17",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.0",
]

[project.scripts]
langchain-use-pydantic = "langchain_use_pydantic:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
